apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-pod
  namespace: ems
  labels:
    app: apigateway-pod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apigateway-pod
  template:
    metadata:
      labels:
        app: apigateway-pod
    spec:
      containers:
        - name: apigateway-pod
          image: bottomhalflimited/ems.gtw.apigateway:emstum-20250827132900
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
