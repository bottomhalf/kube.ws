apiVersion: v1
kind: Service
metadata:
  name: livekit-service
  namespace: cf
spec:
  selector: { app: livekit-server }
  ports:
    - name: http
      port: 7880
      targetPort: 7880
      protocol: TCP
    - name: ws
      port: 7881
      targetPort: 7881
      protocol: TCP
    - name: rtp
      port: 7882
      targetPort: 7882  