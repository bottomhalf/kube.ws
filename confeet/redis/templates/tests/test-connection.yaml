apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "redis.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: redis-cli-test
      image: redis:7.2.4-alpine
      command:
        - sh
        - -c
        - |
          redis-cli -h {{ include "redis.fullname" . }} -p {{ .Values.service.port }} -a "$REDIS_PASSWORD" ping | grep PONG
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "redis.secretName" . }}
              key: REDIS_PASSWORD
