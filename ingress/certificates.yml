apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bottomhalf-tls
  namespace: bt
spec:
  secretName: bottomhalf-tls
  issuerRef:
    name: lets-encrypt
    kind: ClusterIssuer
  commonName: 'www.bottomhalf.in'
  dnsNames:
    -  www.bottomhalf.in
    -  www.axilcorps.com
    -  www.pinkproject.club
    -  www.bottomhalve.com
