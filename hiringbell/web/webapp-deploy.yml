apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-pod
  namespace: hb
  labels:
    app: webapp-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-pod
  template:
    metadata:
      labels:
        app: webapp-pod
    spec:
      containers:
        - name: webapp-pod
          image: bottomhalflimited/hb-web-app
          ports:
            - containerPort: 80
